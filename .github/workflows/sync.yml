name: sync-assets
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Pull images from Supabase parallel
        env:
          SB: https://rkhdkoewhwjtzxpjpjim.supabase.co
        run: |
          set -euo pipefail
          mkdir -p img
          fetch_one() {
            f="$1"
            if [ -z "$f" ]; then return 0; fi
            if [ -f "img/$f" ]; then return 0; fi
            mkdir -p "img/$(dirname "$f")"
            curl -fsSL --max-time 40 --retry 2 --retry-delay 1 -o "img/$f" "$SB/storage/v1/object/public/tb-packs/$f" || echo "FAIL $f"
          }
          export -f fetch_one
          xargs -a filelist.txt -d '\n' -P 10 -I {} bash -c 'fetch_one "$@"' _ {}
          echo "fetched: $(find img -type f | wc -l)"
          git config user.name "themebox-sync"
          git config user.email "sync@themebox.local"
          git add img
          git commit -m "sync assets" || echo "no changes"
          git push
          echo "DONE"
