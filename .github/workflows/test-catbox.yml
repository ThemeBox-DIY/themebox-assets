name: test-catbox
on:
  workflow_dispatch: {}
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: test catbox upload
        run: |
          curl -s -o /tmp/a.png "https://rkhdkoewhwjtzxpjpjim.supabase.co/storage/v1/object/public/tb-packs/cov-IDmU08mbb9-cover.png"
          ls -la /tmp/a.png
          echo "== catbox upload =="
          resp=$(curl -s --max-time 120 -F "reqtype=fileupload" -F "fileToUpload=@/tmp/a.png" "https://catbox.moe/user/api.php")
          echo "RESP: $resp"
          echo "$resp" | grep -q '^https://' && echo "RESULT: CATBOX_OK" || echo "RESULT: CATBOX_FAIL"
